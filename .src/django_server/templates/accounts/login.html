{% extends "base.html" %}
{% load static %}

{% block title %}로그인 — READ:ME{% endblock %}

{% block body_class %}login-body{% endblock %}

{% block extra_css %}
<style>
  .login-body .topbar,
  .login-body .navbar,
  .login-body .footer,
  .login-body .scroll-top-btn { display: none !important; }

  .login-body .main-content {
    padding: 0;
    flex: 1;
  }

  .login-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .login-wrap {
    width: 100%;
    max-width: 380px;
  }
  .login-brand {
    text-align: center;
    margin-bottom: 36px;
  }
  .login-brand-logo {
    display: inline-block;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
    text-decoration: none;
  }
  .login-brand-logo span { color: var(--primary); }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow-md);
  }
  .form-group { margin-bottom: 14px; }
  .form-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .form-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.92rem;
    font-family: inherit;
    background: var(--bg);
    outline: none;
    transition: border-color .2s;
    box-sizing: border-box;
  }
  .form-input:focus { border-color: var(--primary); background: #fff; }
  .login-error {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 14px;
  }
  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: background .2s;
  }
  .btn-login:hover { background: var(--primary-dark); }
</style>
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="login-wrap">
    <div class="login-brand">
      <a href="/" class="login-brand-logo">READ<span>:</span>ME</a>
    </div>

    <div class="login-card">
      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'accounts:login' %}{% if next %}?next={{ next }}{% endif %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
          <label class="form-label" for="username">아이디</label>
          <input class="form-input" type="text" id="username" name="username"
                 placeholder="아이디를 입력하세요" autofocus autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">비밀번호</label>
          <input class="form-input" type="password" id="password" name="password"
                 placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login">로그인</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
