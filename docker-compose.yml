services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-readme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readme1234}
      POSTGRES_DB: ${POSTGRES_DB:-readme_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./.src/infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-readme} -d ${POSTGRES_DB:-readme_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi_server:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - ./.src/fastapi_server:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./.src/django_server:/app
      - ./data.csv:/app/data.csv:ro
      - static_vol:/app/staticfiles
      - media_vol:/app/media
    depends_on:
      db:
        condition: service_healthy
      fastapi_server:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  static_vol:
  media_vol:
