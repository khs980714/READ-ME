{% extends "base.html" %}
{% load static %}

{% block title %}로그인 — READ:ME{% endblock %}

{% block extra_css %}
<style>
  .login-wrap {
    max-width: 420px;
    margin: 60px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
    box-shadow: var(--shadow-md);
  }
  .login-title {
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 0.88rem;
    color: var(--text-sub);
    margin-bottom: 28px;
  }
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    font-family: inherit;
    background: var(--bg);
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--primary); background: #fff; }
  .login-error {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #fca5a5;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.88rem;
    margin-bottom: 16px;
  }
  .btn-login {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: background .2s;
  }
  .btn-login:hover { background: var(--primary-dark); }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
  <h1 class="login-title">관리자 로그인</h1>
  <p class="login-sub">READ:ME 관리 시스템에 접근하려면 로그인하세요.</p>

  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{% url 'accounts:login' %}{% if next %}?next={{ next }}{% endif %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">

    <div class="form-group">
      <label class="form-label" for="username">아이디</label>
      <input class="form-input" type="text" id="username" name="username"
             placeholder="관리자 아이디" autofocus autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">비밀번호</label>
      <input class="form-input" type="password" id="password" name="password"
             placeholder="비밀번호" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login">로그인</button>
  </form>
</div>
{% endblock %}
